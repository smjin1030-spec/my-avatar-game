<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👗 나만의 캐릭터 옷입히기 게임</title>
    <style>
        :root {
            --bg-color: #fef2f2;
            --card-bg: #ffffff;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --text-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        h1 {
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* 아바타 디스플레이 영역 */
        .avatar-section {
            flex: 1;
            min-width: 280px;
            background: #fff5f8;
            border: 2px dashed #fbcfe8;
            border-radius: 16px;
            height: 380px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .avatar-stage {
            width: 200px;
            height: 320px;
            position: relative;
        }

        /* SVG 아바타 레이어 스타일 */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.2s ease;
        }

        /* 컨트롤 패널 영역 */
        .control-section {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .options-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .btn-opt {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opt:hover, .btn-opt.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btns {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-random {
            background-color: #8b5cf6;
            color: white;
        }

        .btn-random:hover {
            background-color: #7c3aed;
        }

        .btn-reset {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-reset:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🎀 나만의 스타일링 아바타 🎀</h1>

    <!-- 좌측: 캐릭터 화면 -->
    <div class="avatar-section">
        <div class="avatar-stage">
            <!-- 1. 몸통 Base -->
            <svg class="layer" viewBox="0 0 200 320">
                <!-- 얼굴/몸통 -->
                <circle cx="100" cy="80" r="35" fill="#ffe0bd"/>
                <path d="M 85 115 L 115 115 L 120 220 L 80 220 Z" fill="#ffe0bd"/>
                <!-- 눈/입 -->
                <circle cx="90" cy="78" r="3" fill="#333"/>
                <circle cx="110" cy="78" r="3" fill="#333"/>
                <path d="M 95 90 Q 100 95 105 90" stroke="#333" stroke-width="2" fill="none"/>
                <!-- 다리 -->
                <rect x="85" y="215" width="12" height="80" rx="6" fill="#ffd1a4"/>
                <rect x="103" y="215" width="12" height="80" rx="6" fill="#ffd1a4"/>
            </svg>

            <!-- 2. 하의 Layer -->
            <svg class="layer" id="layerBottom" viewBox="0 0 200 320"></svg>

            <!-- 3. 상의 Layer -->
            <svg class="layer" id="layerTop" viewBox="0 0 200 320"></svg>

            <!-- 4. 헤어 Layer -->
            <svg class="layer" id="layerHair" viewBox="0 0 200 320"></svg>

            <!-- 5. 신발 Layer -->
            <svg class="layer" id="layerShoes" viewBox="0 0 200 320"></svg>
        </div>
    </div>

    <!-- 우측: 옷 선택 버튼 -->
    <div class="control-section">
        <div>
            <div class="category-title">💇‍♀️ 헤어 스타일</div>
            <div class="options-grid">
                <button class="btn-opt" onclick="setHair(0)">기본</button>
                <button class="btn-opt" onclick="setHair(1)">단발머리</button>
                <button class="btn-opt" onclick="setHair(2)">긴 생머리</button>
                <button class="btn-opt" onclick="setHair(3)">양갈래</button>
            </div>
        </div>

        <div>
            <div class="category-title">👕 상의 (Top)</div>
            <div class="options-grid">
                <button class="btn-opt" onclick="setTop(0)">민소매</button>
                <button class="btn-opt" onclick="setTop(1)">핑크 티셔츠</button>
                <button class="btn-opt" onclick="setTop(2)">노랑 맨투맨</button>
                <button class="btn-opt" onclick="setTop(3)">블루 후드티</button>
            </div>
        </div>

        <div>
            <div class="category-title">👖 하의 (Bottom)</div>
            <div class="options-grid">
                <button class="btn-opt" onclick="setBottom(0)">기본</button>
                <button class="btn-opt" onclick="setBottom(1)">청바지</button>
                <button class="btn-opt" onclick="setBottom(2)">테니스 스커트</button>
                <button class="btn-opt" onclick="setBottom(3)">반바지</button>
            </div>
        </div>

        <div>
            <div class="category-title">👟 신발 (Shoes)</div>
            <div class="options-grid">
                <button class="btn-opt" onclick="setShoes(0)">맨발</button>
                <button class="btn-opt" onclick="setShoes(1)">스니커즈</button>
                <button class="btn-opt" onclick="setShoes(2)">구두</button>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-action btn-random" onclick="randomStyle()">🎲 랜덤 코디</button>
            <button class="btn-action btn-reset" onclick="resetStyle()">🔄 초기화</button>
        </div>
    </div>
</div>

<script>
    // SVG 데이터 정의 (의상/헤어 그래픽 좌표)
    const hairs = [
        "", // 0: 기본
        `<path d="M 65 75 Q 100 30 135 75 Q 135 90 125 95 Q 100 70 75 95 Z" fill="#4b2c20"/>`, // 단발
        `<path d="M 65 75 Q 100 30 135 75 C 140 120 130 170 125 180 Q 115 130 125 90 Q 100 70 75 90 Q 85 130 75 180 C 70 170 60 120 65 75 Z" fill="#1f2937"/>`, // 긴머리
        `<path d="M 65 75 Q 100 35 135 75 Q 125 95 75 95 Z M 55 85 Q 40 100 45 130 Q 60 120 65 90 Z M 145 85 Q 160 100 155 130 Q 140 120 135 90 Z" fill="#d97706"/>` // 양갈래
    ];

    const tops = [
        "", // 0: 민소매
        `<path d="M 80 115 L 120 115 L 125 160 L 75 160 Z M 65 115 L 80 115 L 75 135 Z M 135 115 L 120 115 L 125 135 Z" fill="#f472b6"/>`, // 핑크 티셔츠
        `<path d="M 78 115 L 122 115 L 125 170 L 75 170 Z M 60 115 L 78 115 L 70 145 Z M 140 115 L 122 115 L 130 145 Z" fill="#facc15"/>`, // 노랑 맨투맨
        `<path d="M 75 110 Q 100 120 125 110 L 128 175 L 72 175 Z M 58 115 L 75 115 L 68 155 Z M 142 115 L 125 115 L 132 155 Z" fill="#3b82f6"/>` // 푸른 후드
    ];

    const bottoms = [
        "", // 0: 기본
        `<path d="M 78 160 L 122 160 L 120 250 L 102 250 L 100 180 L 98 250 L 80 250 Z" fill="#2563eb"/>`, // 청바지
        `<path d="M 80 160 L 120 160 L 135 205 L 65 205 Z" fill="#f43f5e"/>`, // 테니스 스커트
        `<path d="M 78 160 L 122 160 L 125 200 L 102 200 L 100 175 L 98 200 L 75 200 Z" fill="#4b5563"/>` // 반바지
    ];

    const shoes = [
        "", // 0: 맨발
        `<rect x="81" y="285" width="18" height="15" rx="4" fill="#ffffff"/><rect x="101" y="285" width="18" height="15" rx="4" fill="#ffffff"/>`, // 스니커즈
        `<path d="M 81 290 L 99 290 L 95 300 L 81 300 Z" fill="#111827"/><path d="M 101 290 L 119 290 L 119 300 L 105 300 Z" fill="#111827"/>` // 구두
    ];

    function setHair(idx) { document.getElementById('layerHair').innerHTML = hairs[idx]; }
    function setTop(idx) { document.getElementById('layerTop').innerHTML = tops[idx]; }
    function setBottom(idx) { document.getElementById('layerBottom').innerHTML = bottoms[idx]; }
    function setShoes(idx) { document.getElementById('layerShoes').innerHTML = shoes[idx]; }

    function randomStyle() {
        setHair(Math.floor(Math.random() * hairs.length));
        setTop(Math.floor(Math.random() * tops.length));
        setBottom(Math.floor(Math.random() * bottoms.length));
        setShoes(Math.floor(Math.random() * shoes.length));
    }

    function resetStyle() {
        setHair(0);
        setTop(0);
        setBottom(0);
        setShoes(0);
    }

    // 초기 상태 세팅 (기본 옷 입혀두기)
    setHair(1);
    setTop(1);
    setBottom(1);
    setShoes(1);
</script>

</body>
</html>
